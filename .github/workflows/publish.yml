name: Publish CLI to npm

# Publishes hyn-view to npm after "CLI and database checks" passes on a push to
# main, but only when package.json carries a version npm does not have yet. Every
# other main commit is a no-op here, so releasing means bumping the version
# (package.json and HYN_VERSION in lib/core.sh; selfcheck keeps them equal).
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored in
# GitHub. One-time setup on npmjs.com (Packages -> hyn-view -> Settings ->
# Trusted publishing -> GitHub Actions): owner AryanVBW, repository HYN-view,
# workflow file publish.yml, environment npm, allowed action npm publish.
# Until that exists, this job fails with ENEEDAUTH and nothing is published.
# After setting it up, publish without a new commit: Actions -> Publish CLI to
# npm -> Run workflow (main). A manual run still requires passing checks.
on:
  workflow_run:
    workflows: [CLI and database checks]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/hyn-view
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      HYN_NO_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The exact commit the checks passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: A manual run needs passing checks on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [[ $passed -gt 0 ]] || { echo "::error::CLI and database checks have not passed on $GITHUB_SHA"; exit 1; }
      - name: Decide whether this version is new
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cli=$(bash bin/hyn --version | awk '{print $NF}')
          [[ $cli == "$version" ]] || { echo "::error::package.json says $version but bin/hyn --version says $cli"; exit 1; }
          if npm view "hyn-view@$version" version >/dev/null 2>&1; then
            echo "hyn-view@$version is already on npm; nothing to publish."
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "Publishing hyn-view@$version."
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Trusted publishing needs npm 11.5.1 or later
        if: steps.version.outputs.publish == 'true'
        run: npm install --global npm@11.20.0 && npm --version
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: |
          npm publish --access public || {
            echo "::error::npm refused the publish. If the log shows ENEEDAUTH, npm trusted publishing is not set up for hyn-view yet (docs/cli-release-readiness.md, release gate 3)."
            exit 1
          }
      - name: Confirm the registry serves the new version
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            [[ $(npm view hyn-view dist-tags.latest) == "${{ steps.version.outputs.version }}" ]] && { echo "latest is ${{ steps.version.outputs.version }}"; exit 0; }
            sleep 10
          done
          echo "::error::npm does not show hyn-view@${{ steps.version.outputs.version }} as latest"; exit 1
